<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ForgeTest - a tiny JavaScript test framework built from scratch to demonstrate closures, objects, and functional programming."
    />
    <title>ForgeTest - Build Your Own Test Framework</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <main class="main">
      <div class="container">
        <div class="toolbar">
          <button id="runBtn" class="btn-run" type="button">
            ▶ Run all tests
          </button>
        </div>

        <p id="summary" class="summary" aria-live="polite"></p>

        <div id="results" class="results"></div>
      </div>
    </main>

    <script type="module" src="runner.js"></script>
  </body>
</html>
