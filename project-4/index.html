<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ForgeTest - a tiny JavaScript test framework built from scratch to demonstrate closures, objects, and functional programming."
    />
    <title>ForgeTest - Build Your Own Test Framework</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header">
      <div class="header-glow" aria-hidden="true"></div>
      <div class="container">
        <h1 class="logo">Forge<span>Test</span></h1>
        <p class="tagline">A test framework built from scratch — closures, objects &amp; functional programming.</p>
      </div>
    </header>

    <main class="main">
      <div class="container">
        <div class="toolbar">
          <button id="runBtn" class="btn-run" type="button">▶ Run all tests</button>
          <label class="filter-toggle">
            <input type="checkbox" id="failsOnly" />
            Show failures only
          </label>
        </div>

        <section id="summary" class="summary hidden" aria-live="polite">
          <div class="stat stat-total">
            <span class="stat-value" id="statTotal">0</span>
            <span class="stat-label">Total</span>
          </div>
          <div class="stat stat-pass">
            <span class="stat-value" id="statPass">0</span>
            <span class="stat-label">Passed</span>
          </div>
          <div class="stat stat-fail">
            <span class="stat-value" id="statFail">0</span>
            <span class="stat-label">Failed</span>
          </div>
          <div class="stat stat-time">
            <span class="stat-value" id="statTime">0<small>ms</small></span>
            <span class="stat-label">Duration</span>
          </div>
        </section>

        <div id="results" class="results"></div>
      </div>
    </main>

    <footer class="footer">
      <div class="container">
        <p>ForgeTest &mdash; a learning project. Open the console to see the same report logged there too.</p>
      </div>
    </footer>

    <script type="module" src="runner.js"></script>
  </body>
</html>
